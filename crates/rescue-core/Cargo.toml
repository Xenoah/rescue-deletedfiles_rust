[package]
name = "rescue-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
uuid.workspace = true
cap-std.workspace = true
png = "0.18.1"
crc32fast = "1"
flate2 = "1"
ruzstd = "0.9.1"
lz4_flex = "0.14.2"
bzip2 = "0.6.1"
lzma-rust2 = {version = "0.25.0", default-features = false, features = ["std", "xz", "lzip"]}
claxon = "0.4.3"
md-5 = "0.10"
tiff = "0.11.3"
roxmltree = { version = "0.21.2", default-features = false, features = ["std"] }
quick-xml = "0.41.0"
zune-core = "0.5.3"
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
same-file = "1"
zip = { version = "2.4", default-features = false }
tempfile.workspace = true
rusqlite = { version = "0.41", features = ["bundled", "limits", "hooks"] }
encoding_rs = "=0.8.35"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
