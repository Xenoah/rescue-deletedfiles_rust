[package]
name = "rescue-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
uuid.workspace = true
cap-std.workspace = true
png = "0.18.1"
crc32fast = "1"
flate2 = "1"
quick-xml = "0.41.0"
zune-core = "0.5.3"
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }
same-file = "1"
zip = { version = "2.4", default-features = false }
tempfile.workspace = true
rusqlite = { version = "0.41", features = ["bundled", "limits"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
