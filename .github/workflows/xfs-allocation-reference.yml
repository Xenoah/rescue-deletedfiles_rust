name: Capture XFS deletion and free-space references
on:
  push:
    branches: [qa/xfs-free-space-reference]
    paths: [.github/workflows/xfs-allocation-reference.yml, tests/xfs-allocation/generate_linux.py]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Capture clean XFS images and independently query the free-space extents
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xfsprogs
          sudo python3 tests/xfs-allocation/generate_linux.py
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add tests/xfs-allocation/*.raw.xz tests/xfs-allocation/manifest.json
          git commit -m "Preserve real XFS deletions, live controls and xfs_db allocation evidence"
          git push origin HEAD:qa/xfs-free-space-reference
