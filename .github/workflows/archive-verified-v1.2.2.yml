name: Archive verified v1.2.2 public evidence
'on':
  push:
    branches:
    - release/document-v1.2.2
permissions:
  contents: write
  actions: read
concurrency:
  group: document-verified-v1.2.2
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RESCUE_RELEASE_TEMP: ${{ runner.temp }}/rescue-release-docs
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        ref: release/v1.2.2
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Require completed public verification and stable publication
      run: gh run watch 42518220293 --exit-status --interval 30
    - name: Prepare evidence collectors from the reviewed release process
      run: |
        python - <<'PYTHON'
        from pathlib import Path
        import os
        root=Path(os.environ['RESCUE_RELEASE_TEMP']);root.mkdir()
        texts={'collect-native-ime.py': "import sys,json,zipfile,hashlib,subprocess,argparse\nfrom pathlib import Path,PureWindowsPath\nsys.path.insert(0,'/workspace/rescue/scripts')\nfrom ime_evidence import require_ime_cleanup, require_repeated_ime\nparser=argparse.ArgumentParser();parser.add_argument('--archive',type=Path,required=True);parser.add_argument('--run-id',type=int,required=True);parser.add_argument('--commit',required=True);args=parser.parse_args()\narchive=args.archive;repo='Xenoah/rescue-deletedfiles_rust';run_id=args.run_id\nfrom public_api import api\nrun=api(f'actions/runs/{run_id}');assert run['head_sha']==args.commit\nartifacts=api(f'actions/runs/{run_id}/artifacts')['artifacts'];artifact=next(x for x in artifacts if x['name']=='windows-gui-screenshots')\nsha=lambda b:hashlib.sha256(b).hexdigest()\nzip_sha=sha(archive.read_bytes())\nif artifact.get('digest'):assert artifact['digest']=='sha256:'+zip_sha\nwith zipfile.ZipFile(archive) as z:\n profile=json.loads(z.read('ime-profile-state.json').decode('utf-8-sig'));assert profile['prepared'] and profile['restored'] and profile['before']==profile['after']\n names=z.namelist();members=[n for n in names if n.endswith('gui-ime-results.json')];assert len(members)==1\n raw=z.read(members[0]);proof=json.loads(raw);require_repeated_ime(proof,require_stages=True);require_ime_cleanup(proof,profile)\n assert proof['status']=='passed' and proof['source_unchanged'] and proof['files_byte_exact']==2\n token=proof['uia']['gui_token'];assert token['elevated']==0 and not token['administrator_enabled'] and token['integrity']==8192\n for item in proof['ime_cycle_screenshots']+[proof['screenshot']]:\n  suffix='/'.join(PureWindowsPath(item['file']).parts[-2:]);matches=[n for n in names if n.endswith(suffix)];assert len(matches)==1\n  data=z.read(matches[0]);assert sha(data)==item['sha256']\n  if item==proof['screenshot']:Path('/workspace/v1.2.2/native-windows.png').write_bytes(data)\nrecord={'user_language_profile':profile,'status':'passed','scope':'Exact v1.2.2 native Windows GUI: eight native Microsoft Japanese IME cycles, then selected recovery under a non-elevated token. This is native pre-publication evidence.','commit':run['head_sha'],'run':run['html_url'],'attempt':run['run_attempt'],'artifact_id':artifact['id'],'artifact_zip_sha256':zip_sha,'original_json_sha256':sha(raw),'all_nine_screenshot_hashes_verified':True,'proof':proof}\nPath('/workspace/rescue/docs/verification/v1.2.2-native-ime.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\\n')\nprint(json.dumps({'status':'passed','native_ime_cycles':8,'files_byte_exact':2,'bytes_exact':proof['bytes_exact'],'gui_binary_sha256':proof['gui_binary_sha256']}))\n", 'collect-public.py': '"""Archive completed v1.2.2 release proof; never publishes or reruns a workflow."""\nimport argparse,hashlib,json,subprocess,zipfile,shutil,sys,urllib.request\nfrom pathlib import Path,PureWindowsPath\nsys.path.insert(0,\'/workspace/rescue/scripts\')\nfrom release_assets import package_names\nfrom ime_evidence import require_ime_cleanup, require_repeated_ime\np=argparse.ArgumentParser();p.add_argument(\'--native-run\',type=int,required=True);p.add_argument(\'--commit\',required=True);p.add_argument(\'--public-run\',type=int,required=True);p.add_argument(\'--proof-zip\',type=Path,required=True);p.add_argument(\'--screens-zip\',type=Path,required=True);a=p.parse_args()\nrepo=\'Xenoah/rescue-deletedfiles_rust\';tag=\'v1.2.2\';commit=a.commit;native_id=a.native_run\nroot=Path(\'/workspace/v1.2.2\');docs=Path(\'/workspace/rescue/docs\')\nfrom public_api import api\ndef sha(data):return hashlib.sha256(data).hexdigest()\ndef file_sha(path):return sha(path.read_bytes())\nrunproof=[]\nfor run_id in [native_id,a.public_run]:\n run=api(f\'actions/runs/{run_id}\');jobs=api(f\'actions/runs/{run_id}/jobs?filter=latest&per_page=100\')[\'jobs\']\n assert run[\'conclusion\']==\'success\' and run[\'head_sha\']==commit\n assert len(jobs)==5 and all(j[\'conclusion\']==\'success\' for j in jobs)\n runproof.append({\'run_id\':run_id,\'url\':run[\'html_url\'],\'attempt\':run[\'run_attempt\'],\'jobs\':[{\'id\':j[\'id\'],\'name\':j[\'name\'],\'conclusion\':j[\'conclusion\']} for j in jobs]})\nartifacts=api(f\'actions/runs/{a.public_run}/artifacts\')[\'artifacts\']\nartifacts={x[\'name\']:x for x in artifacts}\nfor name,path in [(\'published-verification\',a.proof_zip),(\'public-windows-gui-screenshots\',a.screens_zip)]:\n art=artifacts[name];assert not art[\'expired\']\n if art.get(\'digest\'):assert art[\'digest\']==\'sha256:\'+file_sha(path)\nwith zipfile.ZipFile(a.proof_zip) as z:\n members={x for x in z.namelist() if not x.endswith(\'/\')}\n expected={f\'published-format-{platform}-{arch}.json\' for platform,arch in [(\'windows\',\'x64\'),(\'linux\',\'x64\'),(\'macos\',\'x64\'),(\'macos\',\'arm64\')]}|{\'published-format-verification.json\',\'published-format-verification.md\',\'PUBLISHED-SHA256SUMS.txt\'}\n assert members==expected\n sums={name:digest for digest,name in (line.split(\'  \',1) for line in z.read(\'PUBLISHED-SHA256SUMS.txt\').decode(\'ascii\').splitlines())}\n assert set(sums)==members-{\'PUBLISHED-SHA256SUMS.txt\'}\n for name,digest in sums.items():assert sha(z.read(name))==digest,name\n raw=z.read(\'published-format-verification.json\');proof=json.loads(raw);assert proof[\'release_tag\']==tag and len(proof[\'runs\'])==4\n for run in proof[\'runs\']:\n  pub=run[\'published_release\'];assert pub[\'tag\']==tag and pub[\'executable_sha256\']==run[\'binary_sha256\'] and pub[\'tested_after_packaging_and_signing\']\n  assert run[\'disk_verification\'][\'byte_exact\']==864 and run[\'formats\']==35 and run[\'corpus_files\']==36\n  if pub[\'platform\']==\'windows\':windows=run\n ime=windows[\'gui_verification\'][\'ime\'];require_repeated_ime(ime,require_stages=True)\n assert ime[\'gui_binary_sha256\']==windows[\'public_gui_sha256\'] and ime[\'source_unchanged\'] and ime[\'files_byte_exact\']==2\n (docs/\'verification/v1.2.2-published.json\').write_bytes(raw)\n (docs/\'verification/v1.2.2-published.md\').write_bytes(z.read(\'published-format-verification.md\'))\nshots=[];shot_dir=docs/\'images/v1.2.2-windows\';shot_dir.mkdir(exist_ok=True)\nwith zipfile.ZipFile(a.screens_zip) as z:\n public_profile=json.loads(z.read(\'ime-profile-state.json\').decode(\'utf-8-sig\'));require_ime_cleanup(ime,public_profile)\n assert public_profile[\'prepared\'] and public_profile[\'restored\'] and public_profile[\'before\']==public_profile[\'after\']\n names=z.namelist()\n gui_json=[n for n in names if n.endswith(\'gui-ime.json\')];assert len(gui_json)==1\n assert json.loads(z.read(gui_json[0]))==ime\n for item in ime[\'ime_cycle_screenshots\']+[ime[\'screenshot\']]:\n  parts=PureWindowsPath(item[\'file\']).parts[-2:];suffix=\'/\'.join(parts);matches=[n for n in names if n.endswith(suffix)];assert len(matches)==1\n  content=z.read(matches[0]);assert sha(content)==item[\'sha256\']\n  dest=shot_dir/parts[-1];dest.write_bytes(content);shots.append({\'file\':str(dest.relative_to(docs)),\'sha256\':sha(content)})\nnative_ime=json.loads((docs/\'verification/v1.2.2-native-ime.json\').read_text());require_repeated_ime(native_ime[\'proof\'],require_stages=True)\nassert native_ime[\'proof\'][\'gui_binary_sha256\']==windows[\'public_gui_sha256\'] and native_ime[\'all_nine_screenshot_hashes_verified\']\nrelease=api(\'releases/tags/\'+tag);assert not release[\'draft\'] and not release[\'prerelease\']\nexpected=set(package_names(\'1.2.2\'))|{\'SHA256SUMS.txt\'}\nassert {x[\'name\'] for x in release[\'assets\']}==expected\nlatest=api(\'releases/latest\');assert latest[\'tag_name\']==tag\nout=root/\'public-downloads\'\nout.mkdir(exist_ok=True)\nassert {p.name for p in out.iterdir()} <= expected\nfor asset in release[\'assets\']:\n path=out/asset[\'name\']\n if path.exists() and path.stat().st_size==asset[\'size\'] and asset.get(\'digest\')==\'sha256:\'+file_sha(path):continue\n assert asset[\'browser_download_url\'].startswith(\'https://github.com/\'+repo+\'/releases/download/\'+tag+\'/\')\n temporary=out/(asset[\'name\']+\'.partial\')\n try:\n  request=urllib.request.Request(asset[\'browser_download_url\'],headers={\'User-Agent\':\'Rescue-release-verification\'})\n  with urllib.request.urlopen(request,timeout=60) as response,temporary.open(\'wb\') as stream:shutil.copyfileobj(response,stream)\n  assert temporary.stat().st_size==asset[\'size\'] and asset[\'digest\']==\'sha256:\'+file_sha(temporary)\n  temporary.replace(path)\n except Exception as error:\n  if temporary.exists():temporary.unlink()\n  raise RuntimeError(\'Public asset download failed: \'+asset[\'name\']+\'; \'+type(error).__name__+\'; status \'+str(getattr(error,\'code\',None))) from None\nassert {p.name for p in out.iterdir()}==expected\nsums={name:digest for digest,name in (line.split(\'  \',1) for line in (out/\'SHA256SUMS.txt\').read_text().splitlines())};assert set(sums)==expected-{\'SHA256SUMS.txt\'}\nassets=[]\nfor asset in release[\'assets\']:\n f=out/asset[\'name\'];digest=file_sha(f);assert f.stat().st_size==asset[\'size\']\n if asset.get(\'digest\'):assert asset[\'digest\']==\'sha256:\'+digest\n if asset[\'name\'] in sums:assert sums[asset[\'name\']]==digest\n assets.append({\'name\':asset[\'name\'],\'size\':asset[\'size\'],\'url\':asset[\'browser_download_url\'],\'sha256\':digest})\nrecord={\'public_user_language_profile\':public_profile,\'tag\':tag,\'commit\':commit,\'status\':\'passed\',\'release\':release[\'html_url\'],\'published_at\':release[\'published_at\'],\'latest_release\':True,\'native_run\':runproof[0][\'url\'],\'public_run\':runproof[1][\'url\'],\'native_platforms\':4,\'public_platforms\':4,\'native_attempt\':runproof[0][\'attempt\'],\'public_attempt\':runproof[1][\'attempt\'],\'release_assets\':9,\'assets\':assets,\'all_download_checksums_verified\':True,\'artifact_id\':artifacts[\'published-verification\'][\'id\'],\'artifact_zip_sha256\':file_sha(a.proof_zip),\'all_artifact_member_checksums_verified\':True,\'published_proof_sha256\':sha(raw),\'public_ime_cycles\':8,\'public_windows_gui_sha256\':windows[\'public_gui_sha256\'],\'public_screenshot_artifact_id\':artifacts[\'public-windows-gui-screenshots\'][\'id\'],\'public_screenshot_zip_sha256\':file_sha(a.screens_zip),\'screenshots\':shots,\'workflow_jobs\':runproof}\nrecord.update(native_ime_cycles=8,native_ime_artifact_id=native_ime[\'artifact_id\'],native_and_public_windows_gui_bytes_identical=True)\nstress=json.loads((docs/\'verification/v1.2.2-ime-stress.json\').read_text())\nrecord[\'stress_gui_sha256\']=stress[\'product_provenance\'][\'gui_sha256\']\nrecord[\'stress_and_release_windows_gui_bytes_identical\']=record[\'stress_gui_sha256\']==windows[\'public_gui_sha256\']\n(docs/\'verification/v1.2.2-release.json\').write_text(json.dumps(record,ensure_ascii=False,indent=2)+\'\\n\')\nprint(json.dumps({\'status\':\'passed\',\'release\':release[\'html_url\'],\'assets\':len(assets),\'native_attempt\':record[\'native_attempt\'],\'public_attempt\':record[\'public_attempt\'],\'ime_cycles\':8,\'verified_screenshots\':len(shots)}))\n', 'finish-docs.py': 'from pathlib import Path\nimport json\nroot=Path(\'/workspace/rescue\'); docs=root/\'docs\'\nr=json.loads((docs/\'verification/v1.2.2-release.json\').read_text())\nassert r[\'status\']==\'passed\' and r[\'all_download_checksums_verified\'] and r[\'native_and_public_windows_gui_bytes_identical\']\nassert r[\'release_assets\']==9 and r[\'native_platforms\']==r[\'public_platforms\']==4\np=root/\'README.md\';s=p.read_text();s=s.replace(\'**v1.2.2ではWindows日本語IMEの取消処理と、実操作テストの終了手順を修正しました。**\',\'**最新公開版はv1.2.2です。** Windows日本語IMEの取消処理と、実操作テストの終了手順を修正しました。\');p.write_text(s)\np=docs/\'V1_2_ACCEPTANCE.md\';s=p.read_text()\nrow=f"| [v1.2.2]({r[\'release\']}) | Windows IME取消・正常終了・設定復元 | [4環境合格]({r[\'native_run\']}) | [4環境合格]({r[\'public_run\']}) | [全記録](verification/v1.2.2-published.json) · [公開確認](verification/v1.2.2-release.json) |"\nassert row not in s\nlines=s.splitlines();i=next(i for i,line in enumerate(lines) if line.startswith(\'| [v1.2.0]\'));lines.insert(i+1,row);s=\'\\n\'.join(lines)+\'\\n\'\ncompletion=f"""## v1.2.2の完了状態\n\nv1.2.2を安定版として公開した。最終コミット `{r[\'commit\']}` のネイティブCIと、公開したポータブルを再ダウンロードした実物検証は、Windows x64・Linux x64・macOS Intel/Apple Siliconの全4環境で合格した。ネイティブは実行{r[\'native_attempt\']}回、公開実物は実行{r[\'public_attempt\']}回で合格している。\n\nWindowsは公開前・公開後とも実Microsoft日本語IMEの取消・変換・確定を8回ずつ検証し、使用したGUIのSHA-256が一致した。GUIの通常終了と、元の言語設定の完全復元も確認した。追加の候補試験では4回の新規起動・計32回に成功している。過去の失敗はそのまま保存し、合格へ置き換えていない。\n\nローカルはRust86テスト・35統合群・6配布契約テスト、Clippy、fmt、26枚の新規GUI画面と復元バイト一致を確認した。公開添付は8配布物と共通SHA256SUMSの9点で、実際に9点を取得して全配布物のチェックサムを照合した。\n\n[公開確認](verification/v1.2.2-release.json) · [公開実物の全記録](verification/v1.2.2-published.json) · [ネイティブIME](verification/v1.2.2-native-ime.json) · [32回の連続起動](verification/v1.2.2-ime-stress.json) · [実画面](UI-v1.2.md)。以下の失敗・診断の記述は、この完了までの経緯である。\n\n"""\ns=s.replace(\'## 公開状態\',completion+\'## 公開状態\',1)\ns=s.replace(\'v1.2.2は最終コミットの4環境CIと公開実物の検証を完了してから安定版とする。\',\'最終コミットの4環境CIと公開実物の検証も完了し、v1.2.2を安定版にした。\')\np.write_text(s)\np=docs/\'UI-v1.2.md\';s=p.read_text();assert \'## 公開Windows GUIの実画面\' not in s\ns+=\'\\n## 公開Windows GUIの実画面\\n\\n公開済みv1.2.2ポータブルを再取得し、同梱GUIを非昇格・中整合性・管理者グループ無効のプロセスで操作した。実Microsoft日本語IMEのローマ字入力で取消・再変換・確定を8回連続実行し、日本語名2ファイル・1,428バイトのZIP復元と元ソースの不変を確認した。正常終了と元の入力設定の完全復元も確認済み。\\n\\n![公開Windows GUIの復元完了](images/v1.2.2-windows/windows-gui-complete.png)\\n\\n![8回目の取消後の再変換と確定](images/v1.2.2-windows/windows-ime-cycle-8.png)\\n\\n各回と復元完了の9枚を新規撮影し、実行時JSONのSHA-256と照合した。公開前後でGUIバイト列が一致している。[配布物・実行・画像のハッシュ](verification/v1.2.2-release.json) · [公開実物の全記録](verification/v1.2.2-published.json)。第三者スクリーンリーダーを用いた人の評価は別課題である。\\n\';p.write_text(s)\np=docs/\'BACKLOG_V1_1.md\';s=p.read_text();s+=\'\\nv1.2.2を公開済み。Windows IME取消修正とテスト終了手順を検証し、4環境のネイティブCI・公開実物検証が合格した。Windowsは公開前後8回ずつ、追加の連続起動試験は4起動・32回に成功。添付9点と全チェックサムを確認した。[公開記録](verification/v1.2.2-release.json)。\\n\';p.write_text(s)\nprint(\'Updated current release summary, acceptance, Windows screenshots and backlog\')\n', 'prepare-review.py': '"""Prepare the final PR body and release screenshot notes after verification."""\nimport json,subprocess\nfrom pathlib import Path\nfrom public_api import api\n\nroot=Path(\'/workspace/rescue\');local=Path(\'/workspace/v1.2.2\')\nrepo=\'Xenoah/rescue-deletedfiles_rust\'\nr=json.loads((root/\'docs/verification/v1.2.2-release.json\').read_text())\nassert r[\'status\']==\'passed\' and r[\'all_download_checksums_verified\'] and r[\'native_and_public_windows_gui_bytes_identical\']\nassert r[\'release_assets\']==9\nhead=subprocess.check_output([\'git\',\'rev-parse\',\'HEAD\'],cwd=root,text=True).strip()\nassert not subprocess.check_output([\'git\',\'status\',\'--porcelain\'],cwd=root,text=True).strip()\nbase=f\'https://github.com/{repo}/blob/{head}\'\nbody=f\'\'\'Windows日本語IMEの取消通知を固定時間で判定していたため、正常な遅延を失敗と扱っていました。実際の取消・変換・確定状態を順に観測し、遅延イベント列のegui回帰テストを追加しました。\n\n連続起動時の変換失敗は、Rescueを起動しない標準WPF入力欄でも再現しました。テストが終了直前に入力言語を強制変更するとCloseが停止しており、GUIを通常終了してから全体の言語設定を復元する手順に修正しました。GUIの強制終了・異常終了と設定復元漏れを配布判定で拒否します。\n\n- [v1.2.2リリース]({r[\'release\']})：8インストーラー/ポータブルとSHA256SUMSの9点。全ダウンロードを照合済み。\n- [ネイティブ4環境]({r[\'native_run\']})と[公開実物4環境]({r[\'public_run\']})が合格。Windowsは同一GUIバイト列で各8回の実IME操作に合格。\n- [追加の連続起動試験](https://github.com/{repo}/actions/runs/42514259957)：4起動・32回、36画像のハッシュ、正常終了、設定復元を確認。\n- Rust86テスト・35統合群・6配布契約テスト、Clippy/fmt。新規GUI26画面と公開Windows9画面を記録。\n\n[受入台帳]({base}/docs/V1_2_ACCEPTANCE.md) · [実画面]({base}/docs/UI-v1.2.md) · [全配布物・実行・画像のハッシュ]({base}/docs/verification/v1.2.2-release.json)。失敗したv1.2.1タグと診断記録は保持しています。\n\'\'\'\n(local/\'pr-body.md\').write_text(body,encoding=\'utf-8\')\nrelease=api(\'releases/tags/v1.2.2\')\nassert not release[\'draft\'] and not release[\'prerelease\'] and len(release[\'assets\'])==9\nnotes=release[\'body\']\nheading=\'## 公開Windowsパッケージの実画面\'\nassert heading not in notes\nnotes+=f\'\'\'\\n\\n{heading}\n\n公開ポータブルを再取得し、実Microsoft日本語IMEで8回の取消・再変換・確定と、選択した2ファイルのバイト一致を確認しました。GUIの正常終了と元の入力設定の復元も合格しています。\n\n![公開Windows GUIでの復元完了](https://raw.githubusercontent.com/{repo}/{head}/docs/images/v1.2.2-windows/windows-gui-complete.png)\n\n[スクリーンショットと検証台帳]({base}/docs/UI-v1.2.md) · [配布物と証跡のハッシュ]({base}/docs/verification/v1.2.2-release.json)\n\'\'\'\n(local/\'final-release-notes.md\').write_text(notes,encoding=\'utf-8\')\nprint(json.dumps({\'documentation_commit\':head,\'pr_body\':str(local/\'pr-body.md\'),\'release_notes\':str(local/\'final-release-notes.md\')}))\n', 'public_api.py': "import json,os,subprocess\ndef api(path):\n    return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path],text=True))\n"}
        for name,content in texts.items():
            (root/name).write_text(content.replace('/workspace/rescue',str(Path.cwd())).replace('/workspace/v1.2.2',str(root)),encoding='utf-8')

        PYTHON
    - name: Download and checksum-verify original evidence archives
      run: |
        python - <<'PYTHON'
        import hashlib,json,os,subprocess,zipfile
        from pathlib import Path
        root=Path(os.environ['RESCUE_RELEASE_TEMP'])
        def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/'+path],text=True))
        publisher=api('actions/runs/42518220293');assert publisher['conclusion']=='success' and publisher['head_sha']=='f3c74ea9309eb71ac1f618eda5bf9de8b2713dc3'
        for rid,name,target in [(42514904244,'windows-gui-screenshots','native-screens.zip'),(42518348653,'published-verification','public-proof.zip'),(42518348653,'public-windows-gui-screenshots','public-screens.zip'),(42518220293,'release-publication-proof','publication-proof.zip')]:
            artifacts=api(f'actions/runs/{rid}/artifacts')['artifacts'];matches=[a for a in artifacts if a['name']==name];assert len(matches)==1
            artifact=matches[0];path=root/target
            with path.open('wb') as stream:
                response=subprocess.run(['gh','api',f"repos/{os.environ['GH_REPO']}/actions/artifacts/{artifact['id']}/zip"],stdout=stream,stderr=subprocess.PIPE)
            if response.returncode:raise RuntimeError('Cannot retrieve artifact '+name+'; exit '+str(response.returncode))
            assert hashlib.sha256(path.read_bytes()).hexdigest()==artifact['digest'].removeprefix('sha256:')
        with zipfile.ZipFile(root/'publication-proof.zip') as archive:
            proof=json.loads(archive.read('publication.json'))
            assert proof['status']=='passed' and proof['release_commit']=='33261891be5ffc830a909d253e1a3da733bd8e2d' and proof['public_run']==42518348653
            Path('docs/verification/v1.2.2-publication.json').write_text(json.dumps(proof,indent=2)+'\n')

        PYTHON
    - name: Verify native and public proof, screenshots and every download
      run: |-
        python "$RESCUE_RELEASE_TEMP/collect-native-ime.py" --archive "$RESCUE_RELEASE_TEMP/native-screens.zip" --run-id 42514904244 --commit 33261891be5ffc830a909d253e1a3da733bd8e2d
        python "$RESCUE_RELEASE_TEMP/collect-public.py" --native-run 42514904244 --public-run 42518348653 --commit 33261891be5ffc830a909d253e1a3da733bd8e2d --proof-zip "$RESCUE_RELEASE_TEMP/public-proof.zip" --screens-zip "$RESCUE_RELEASE_TEMP/public-screens.zip"
        python "$RESCUE_RELEASE_TEMP/finish-docs.py"
    - name: Commit evidence only to the unchanged release documentation branch
      run: |-
        python - <<'PYTHON'
        from pathlib import Path
        import subprocess
        expected='33261891be5ffc830a909d253e1a3da733bd8e2d'
        assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==expected
        remote=subprocess.check_output(['git','ls-remote','origin','refs/heads/release/v1.2.2'],text=True).split()[0]
        assert remote==expected,'Release documentation branch changed; do not overwrite it'
        files=subprocess.check_output(['git','ls-files','--modified','--others','--exclude-standard'],text=True).splitlines()
        assert files and all(p=='README.md' or p.startswith('docs/') for p in files),files
        subprocess.run(['git','diff','--check'],check=True)
        subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
        subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
        subprocess.run(['git','add','README.md','docs'],check=True)
        subprocess.run(['git','commit','-m','Document verified v1.2.2 public packages and Windows screenshots'],check=True)
        subprocess.run(['git','push','origin','HEAD:refs/heads/release/v1.2.2'],check=True)
        PYTHON
    - name: Prepare review body and append the verified Windows release screenshot
      run: |-
        python "$RESCUE_RELEASE_TEMP/prepare-review.py"
        gh release edit v1.2.2 --notes-file "$RESCUE_RELEASE_TEMP/final-release-notes.md"
    - name: Record immutable documentation provenance
      run: |
        python - <<'PYTHON'
        import json,os,subprocess
        from pathlib import Path
        root=Path(os.environ['RESCUE_RELEASE_TEMP'])
        commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
        release=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/releases/tags/v1.2.2'],text=True))
        assert not release['prerelease'] and len(release['assets'])==9
        (root/'documentation.json').write_text(json.dumps({'status':'passed','documentation_commit':commit,'branch':'release/v1.2.2','release_commit':'33261891be5ffc830a909d253e1a3da733bd8e2d','native_run':42514904244,'public_run':42518348653,'publisher_run':42518220293,'main_modified':False},indent=2)+'\n')

        PYTHON
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: v1.2.2-documentation-proof
        path: '${{ env.RESCUE_RELEASE_TEMP }}/documentation.json

