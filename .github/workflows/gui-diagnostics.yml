name: Windows GUI accessibility diagnostics
on:
  push:
    branches: ['v1-ui-*']
  workflow_dispatch:
    inputs:
      legacy_cross_user:
        description: Rerun known cross-logon transport and scheduled-token diagnostics
        type: boolean
        default: false
      native_run:
        description: Existing successful native CI run with identical product sources; 0 rebuilds
        type: number
        default: 42235348093
permissions:
  contents: read
  actions: read
concurrency:
  group: gui-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  RUSTFLAGS: '-C target-feature=+crt-static'
jobs:
  gui:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-test.txt
      - uses: actions/cache/restore@v4
        if: ${{ !inputs.native_run }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-2022-x64-rust-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-2022-x64-rust-1.99.1-
      - run: cargo fetch --locked
        if: ${{ !inputs.native_run }}
      - run: python scripts/ci_command.py cargo test -p rescue-gui --target x86_64-pc-windows-msvc --locked --offline
        if: ${{ !inputs.native_run }}
      - run: python scripts/ci_command.py cargo build --release -p rescue-gui --target x86_64-pc-windows-msvc --locked --offline
        if: ${{ !inputs.native_run }}
      - name: Require identical product sources for artifact diagnostics
        if: ${{ inputs.native_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN" > native-run.json
          python -c "import json; d=json.load(open('native-run.json')); assert d['conclusion']=='success'; print(d['head_sha'])" > native-head.txt
          git diff --exit-code "$(cat native-head.txt)" -- Cargo.toml Cargo.lock crates
      - uses: actions/download-artifact@v4
        if: ${{ inputs.native_run }}
        with:
          name: native-windows-x64
          path: diagnostic-native
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
      - name: Extract only the verified native executables
        if: ${{ inputs.native_run }}
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('diagnostic-native'); proof=json.loads((root/'verification-windows-x64.json').read_text()); assert proof['status']=='passed'
          destination=Path('target/x86_64-pc-windows-msvc/release'); destination.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(next(root.glob('*-portable.zip'))) as archive:
              for name,kind in [('rescue.exe','cli'),('rescue-gui.exe','gui')]:
                  data=archive.read(name); assert hashlib.sha256(data).hexdigest()==proof['portable_'+kind+'_sha256']; (destination/name).write_bytes(data)
          PYTHON
      - name: Record native language and token environment
        shell: powershell
        continue-on-error: true
        run: |
          Get-WinUserLanguageList | ConvertTo-Json -Depth 4
          whoami /user
          Get-ChildItem "$env:windir\System32\IME" -ErrorAction SilentlyContinue | Select-Object Name
      - name: Diagnose UIA under the runner's own token (isolates the limited-token effect)
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/x86_64-pc-windows-msvc/release/rescue-gui.exe --output gui-native-unlimited.json
      - name: Native UIA settings, Unicode names, selection and exact recovery (limited test account; unresolved, diagnostic only)
        if: ${{ inputs.legacy_cross_user }}
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/x86_64-pc-windows-msvc/release/rescue-gui.exe --output gui-native-results.json --limited
      - name: Native UIA under a medium-integrity token with administrator access removed
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/x86_64-pc-windows-msvc/release/rescue-gui.exe --output gui-native-desktop.json --desktop-token
      - name: Native keyboard input under the same restricted token
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/x86_64-pc-windows-msvc/release/rescue-gui.exe --output gui-native-keyboard.json --desktop-token --keyboard
      - name: Real limited GUI with the UIA driver in the runner logon
        if: ${{ inputs.legacy_cross_user }}
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/x86_64-pc-windows-msvc/release/rescue-gui.exe --output gui-limited-product.json --limited-gui
      - name: Real limited GUI with native keyboard input
        if: ${{ inputs.legacy_cross_user }}
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/x86_64-pc-windows-msvc/release/rescue-gui.exe --output gui-limited-keyboard.json --limited-gui --keyboard
      - name: Scheduler least-privilege GUI with native UIA
        if: ${{ inputs.legacy_cross_user }}
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/x86_64-pc-windows-msvc/release/rescue-gui.exe --output gui-scheduled.json --scheduled-gui
      - name: Scheduler least-privilege GUI with native keyboard
        if: ${{ inputs.legacy_cross_user }}
        continue-on-error: true
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/x86_64-pc-windows-msvc/release/rescue-gui.exe --output gui-scheduled-keyboard.json --scheduled-gui --keyboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gui-diagnostics
          path: |
            gui-native-results.json
            gui-native-unlimited.json
            gui-native-desktop.json
            gui-native-keyboard.json
            gui-limited-product.json
            gui-limited-keyboard.json
            gui-scheduled*.json
            rescue-owned-uia-*/uia.json
            rescue-owned-uia-*/std*.txt
            rescue-owned-uia-*/windows-gui-complete.png
          if-no-files-found: ignore
