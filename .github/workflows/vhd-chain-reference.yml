name: Verify relocated VHD chains against full Windows driver readbacks
on:
  push:
    branches: [qa/windows-vhd-chain-reference]
    paths: ['tests/vhd-chain/capture_driver_raw.py', '.github/workflows/vhd-chain-reference.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reopen captured VHD chains after relocation and preserve the Windows guest bytes
        run: python -u tests/vhd-chain/capture_driver_raw.py
      - name: Preserve verified differencing images
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add tests/vhd-chain
          git commit -m "Preserve complete Windows guest bytes after relocating three differencing VHD chains"
          git push origin HEAD:qa/windows-vhd-chain-reference
