name: Verify and release
on:
  push:
    branches: [main, work, 'v1-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  MACOSX_DEPLOYMENT_TARGET: '13.0'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            executable: rescue
          - os: windows-2022
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            executable: rescue.exe
          - os: macos-26-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            executable: rescue
          - os: macos-26
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            executable: rescue
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.platform == 'windows' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent preview test decoder
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-test.txt
      - name: Install Linux GUI and independent filesystem tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libraw-bin lvm2 librsvg2-bin unrar liblzf1 libcurl3-gnutls libopenexr-dev libheif-examples gddrescue android-sdk-libsparse-utils p7zip-full cabextract libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libxcb-shape0 libxcb-xfixes0 libgl1-mesa-dri libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev xvfb fonts-noto-cjk ntfs-3g dosfstools mtools exfatprogs exfat-fuse mdadm xfsprogs e2fsprogs qemu-utils sleuthkit testdisk ewf-tools afflib-tools parted lz4 zstd ffmpeg imagemagick dmg2img bchunk xorriso btrfs-progs
      - name: Extract the VirtualBox reference disk reader
        if: runner.os == 'Linux'
        run: bash scripts/ci_virtualbox_reader.sh
      - name: Verify disposable native fixture setup before compiling
        timeout-minutes: 4
        run: python scripts/ci_command.py python scripts/e2e_restore_native.py --fixture-only --output fixture-setup.json
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.arch }}-rust-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.arch }}-rust-1.99.1-
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: python scripts/test_release_assets.py
      - run: python scripts/ci_command.py cargo clippy --workspace --all-targets --target ${{ matrix.target }} --locked --offline -- -D warnings
      - run: python scripts/ci_command.py cargo test --workspace --target ${{ matrix.target }} --locked --offline
      - run: python scripts/ci_command.py cargo build --workspace --target ${{ matrix.target }} --locked --offline
      - name: Exercise real debug CLI and MCP commands with a 1 MiB main-thread stack
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ulimit -s 1024
          python scripts/ci_command.py python scripts/e2e.py --binary target/${{ matrix.target }}/debug/rescue
      - name: Debug CLI and MCP integration (all integration suites)
        run: python scripts/ci_command.py python scripts/run_integration.py --binary target/${{ matrix.target }}/debug/${{ matrix.executable }}
      - name: Read seven real Btrfs snapshot unlinks in plain and compressed inline extents
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_btrfs_snapshots.py --independent --binary target/${{ matrix.target }}/debug/rescue
      - name: Restore seven actually unlinked files from an independently generated APFS snapshot
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_apfs_snapshots.py --binary target/${{ matrix.target }}/debug/rescue
      - name: Real ext2/3/4 deletions, split RAW and virtual disks
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_extended_filesystems.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover shifted GNU ddrescue acquisitions of Windows MBR and 4Kn GPT partitions
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_ddrescue_partitions.py --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover JPEG 2000 images deleted on FAT32 and ext4 and independently decode their pixels
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_jpeg2000.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover deleted Photoshop documents on FAT32 and ext4 and decode their layer channels
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_photoshop.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover deleted HEIC and AVIF photos on FAT32 and ext4 and independently decode them
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_heif.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Resolve explicit QCOW2 backing chains and compare seven unlinks per guest with QEMU
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_qcow2_backing.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Validate historical QCOW2 disks against QEMU and recover their deleted files
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_qcow2_snapshots.py --qemu-img /usr/bin/qemu-img --binary target/${{ matrix.target }}/debug/rescue
      - name: Independently expand six QCOW v1 deletion disks and five allocation geometries with QEMU
        if: runner.os == 'Linux'
        run: |
          python scripts/ci_command.py python scripts/e2e_qcow1.py --native --binary target/${{ matrix.target }}/debug/rescue
          python scripts/ci_command.py python scripts/e2e_qcow1_geometry.py --independent --binary target/${{ matrix.target }}/debug/rescue
      - name: Check real XFS unlinks, clean journals and free blocks with xfsprogs
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_xfs_allocation.py --xfs-tools --binary target/${{ matrix.target }}/debug/rescue
      - name: Cross-check ext4 allocation groups with e2fsprogs and The Sleuth Kit
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_ext4_allocation.py --tsk --binary target/${{ matrix.target }}/debug/rescue
      - name: Cross-check Apple deletion images with The Sleuth Kit
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_hfs_allocation.py --tsk --binary target/${{ matrix.target }}/debug/rescue
      - name: Compare QCOW2 Zstandard and extended L2 imports with QEMU and real deletions
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_qcow2_subclusters.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover GNU ddrescue captures of real deletions with independent coverage checks
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_ddrescue.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover real FAT32 and ext4 unlinks from GNU and unaligned split RAW images
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_split_raw.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover seven NTFS unlinks across a non-aligned split RAW boundary beyond 4 GiB
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_split_raw.py --large --binary target/${{ matrix.target }}/debug/rescue
      - name: Compare Android sparse captures and real FAT32 and ext4 deletions with AOSP libsparse
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_android_sparse.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Locate fingerprinted fragments of seven actually deleted FAT files
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_fingerprinted.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover 21 actual two-run FAT unlinks with original lengths and whole-file hashes
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_whole_hash.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover 21 actual regularly fragmented FAT unlinks with original lengths and whole-file hashes
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_strided_files.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover eight ext4 unlinks from e2fsprogs block locations
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_known_extents.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover deleted FAT32 files from five independently compressed RAW images
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_compressed_raw.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Carve nine Netpbm images after actual ext4 unlinks and decode the pixels
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_netpbm.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Carve seven HTML documents after actual FAT32 deletions
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_html.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Carve seven GNU, PAX and ustar archives actually deleted on FAT32
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_tar.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Carve seven actual AAC-LC ext4 unlinks and independently decode the results
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_aac.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Carve ten actually unlinked audio and font files from ext4
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_deleted_audio_fonts.py --binary target/${{ matrix.target }}/debug/rescue
      - name: Compare Windows 4Kn GPT and seven native NTFS unlinks with libvhdi and Sleuth Kit
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vhdx_4kn.py --independent --binary target/${{ matrix.target }}/debug/rescue
      - name: Restore Windows MakeCAB and gcab files after ext4 unlink and compare all members with libmspack
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_cab.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover nine real FAT32 7z deletions and independently decode every original member
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_sevenz.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Restore deleted RAR archives and compare all members with UnRAR
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_rar.py --unrar /usr/bin/unrar --binary target/${{ matrix.target }}/debug/rescue
      - name: Verify persistent Linux snapshots against kernel readbacks and ext4 inode history
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_lvm2_snapshots.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Verify Linux LVM2 physical metadata and kernel disk readbacks
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_lvm2.py --lvm /usr/sbin/lvm --binary target/${{ matrix.target }}/debug/rescue
      - name: Verify DNG recovery and sensor samples on FAT32 and ext4
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_dng.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Compare ext2 and ext3 allocation-aware recovery with Sleuth Kit and e2fsck
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_legacy_ext.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Restore real deleted Windows Media files and decode their audio and video
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_asf.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover SVG and SVGZ after real FAT32 and ext4 unlinks and independently render their pixels
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_svg.py --rsvg-convert /usr/bin/rsvg-convert --binary target/${{ matrix.target }}/debug/rescue
      - name: Compare standalone VMDK imports and real deleted Windows files with QEMU
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vmdk.py --independent --binary target/${{ matrix.target }}/debug/rescue
      - name: Compare split and flat VMware descriptors with independent QEMU images
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vmdk_split.py --independent --binary target/${{ matrix.target }}/debug/rescue
      - name: Import Windows and QEMU VHDX and recover genuine NTFS deletions
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vhdx.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Restore deleted files from QEMU fixed and dynamic classic VHD
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vhd.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Restore all historical file types from a multisession ISO with xorriso
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_iso_sessions.py --binary target/${{ matrix.target }}/debug/rescue
      - name: Cross-check two-session CD-ROM data tracks with bchunk and xorriso
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_optical.py --independent --binary target/${{ matrix.target }}/debug/rescue
      - name: Cross-check Apple disk images with dmg2img and QEMU
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_udif.py --independent --binary target/${{ matrix.target }}/debug/rescue
      - name: Mount both the current APFS volume and its retained snapshot read-only in macOS
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        run: python scripts/ci_command.py python scripts/apfs_native_reader.py
      - name: Convert Apple-generated raw, zlib, bzip2, ADC, LZFSE and LZMA disk images
        if: runner.os == 'macOS' && matrix.arch == 'arm64'
        run: python scripts/ci_command.py python scripts/e2e_udif.py --hdiutil --binary target/${{ matrix.target }}/debug/rescue
      - name: Verify font tables in fontTools and render recovered glyphs with FreeType
        if: runner.os == 'Linux'
        run: |
          python -m pip install --disable-pip-version-check fonttools==4.61.1
          python scripts/ci_command.py python scripts/e2e_fonts.py --independent --binary target/${{ matrix.target }}/debug/rescue
      - name: Reopen carved MP3, FLAC, AIFF and TIFF with FFmpeg and ImageMagick
        if: runner.os == 'Linux'
        run: |
          python scripts/ci_command.py python scripts/e2e_mp3.py --independent --binary target/${{ matrix.target }}/debug/rescue
          python scripts/ci_command.py python scripts/e2e_flac.py --independent --binary target/${{ matrix.target }}/debug/rescue
          python scripts/ci_command.py python scripts/e2e_aiff.py --independent --binary target/${{ matrix.target }}/debug/rescue
          python scripts/ci_command.py python scripts/e2e_tiff.py --independent --binary target/${{ matrix.target }}/debug/rescue
      - name: Verify independently encoded Zstandard and LZ4 frames
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_frame_archives.py --independent --binary target/${{ matrix.target }}/debug/rescue
      - name: Recover real FAT32 deletions on a GNU Parted Apple Partition Map
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_apple_partitions.py --parted --binary target/${{ matrix.target }}/debug/rescue
      - name: Verify forensic exports and deleted files on VHDX, AFF and EWF
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_forensic_images.py --binary target/${{ matrix.target }}/debug/rescue
      - name: Optional PhotoRec recovery with independent originals
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_photorec.py --binary target/${{ matrix.target }}/debug/rescue
      - name: Independent NTFS metadata
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/independent_ntfs.py --binary target/${{ matrix.target }}/debug/rescue
      - name: Independent FAT metadata
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/independent_fat.py --binary target/${{ matrix.target }}/debug/rescue
      - name: Compare all VDI generations with VirtualBox and restore each ext4 deletion state
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vdi_chain.py --binary target/${{ matrix.target }}/debug/rescue --vbox-img "$RESCUE_TEST_VBOX_IMG"
      - name: Refuse standalone VirtualBox VMDK children and verify all seven unlinks through the complete chain
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vmdk_vbox_parent.py --binary target/${{ matrix.target }}/debug/rescue --vbox-img "$RESCUE_TEST_VBOX_IMG"
      - name: Compare VMDK snapshot generations with QEMU and VirtualBox and recover real deletions
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vmdk_chain.py --binary target/${{ matrix.target }}/debug/rescue --qemu-img /usr/bin/qemu-img --vbox-img "$RESCUE_TEST_VBOX_IMG"
      - name: Recover deleted OpenEXR files and compare every decoded channel with OpenEXR
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_openexr.py --native --binary target/${{ matrix.target }}/debug/rescue
      - name: Build native release executables
        run: python scripts/ci_command.py cargo build --release --workspace --target ${{ matrix.target }} --locked --offline
      - name: Read complete differencing VHD guests through the Windows virtual disk driver
        if: runner.os == 'Windows'
        run: python scripts/ci_command.py python scripts/e2e_vhd_chain.py --windows-driver --binary target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Cross-check fixed and dynamic VHD bases with Sleuth Kit
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vhd_chain.py --tsk --binary target/${{ matrix.target }}/release/rescue
      - name: Cross-check all differencing VHDX generations with the native Windows driver
        if: runner.os == 'Windows'
        run: python scripts/ci_command.py python scripts/e2e_vhdx_chain.py --windows-driver --binary target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Check VHDX parents and recover the 512-byte and 4Kn NTFS deletions on Linux
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vhdx_chain.py --tsk --binary target/${{ matrix.target }}/release/rescue
      - name: Recover both NTFS volumes across the 4 GiB differencing VHDX bitmap boundary
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vhdx_bitmap_boundary.py --binary target/${{ matrix.target }}/release/rescue
      - name: Restore seven Windows NTFS deletions across a 4 GiB VHDX BAT chunk boundary
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vhdx_chunk.py --binary target/${{ matrix.target }}/release/rescue
      - name: Verify original disk hashes for rewritten QEMU VMDK descriptors across 2 GiB
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vmdk_cid_boundary.py --binary target/${{ matrix.target }}/release/rescue
      - name: Recover across QEMU's actual 2 GiB flat and sparse VMDK split
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_vmdk_boundary.py --binary target/${{ matrix.target }}/release/rescue
      - name: Release CLI and MCP integration (all integration suites)
        run: python scripts/ci_command.py python scripts/run_integration.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --index-reports index-results
      - name: Independent FAT12 and FAT16 deletion
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/independent_classic_fat.py --binary target/${{ matrix.target }}/release/rescue --output independent-classic-fat.json
      - name: Record JPEG entropy and pixel verification
        run: python scripts/ci_command.py python scripts/e2e_jpeg.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output jpeg-results.json
      - name: Record document and media carving verification
        run: python scripts/ci_command.py python scripts/e2e_documents.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output document-results.json
      - name: Record NTFS extension, allocation and alias verification
        run: python scripts/ci_command.py python scripts/e2e_ntfs_extents.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output ntfs-results.json
      - name: Record lost-volume and damaged-boot verification
        run: python scripts/ci_command.py python scripts/e2e_discovery.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output discovery-results.json
      - name: Record detached NTFS and synthetic quick-format verification
        run: python scripts/ci_command.py python scripts/e2e_ntfs_remnants.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output remnant-results.json
      - name: Record RAID missing-member, parity and reconstruction evidence
        run: python scripts/ci_command.py python scripts/e2e_raid.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output raid-results.json
      - name: Independent kernel mdadm RAID5 and RAID6 arrays
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: python scripts/ci_command.py python scripts/e2e_raid_native.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output raid-native-results.json
      - name: Independent actual NTFS quick-format
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_quickformat.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output quickformat-results.json
      - name: Actual Windows NTFS ADS deletion on an owned VHD
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_ntfs_native.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output ntfs-native-results.json
      - name: Record resumable acquisition and read-map verification
        run: python scripts/ci_command.py python scripts/e2e_imaging.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output imaging-results.json
      - name: Windows read-only helper and preview handle transfer on owned VHD
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_read_access_native.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output read-access-native-results.json
      - name: Native Windows UIA from settings to selected ZIP recovery
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/${{ matrix.target }}/release/rescue-gui.exe --output gui-native-results.json
      - name: Non-elevated Windows GUI recovery
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/${{ matrix.target }}/release/rescue-gui.exe --output gui-limited-results.json --desktop-token
      - name: Non-elevated Windows GUI keyboard recovery
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/${{ matrix.target }}/release/rescue-gui.exe --output gui-keyboard-results.json --desktop-token --keyboard
      - name: Install Japanese input support
        if: runner.os == 'Windows'
        shell: powershell
        timeout-minutes: 10
        run: |
          $capability=Get-WindowsCapability -Online -Name 'Language.Basic~~~ja-JP~0.0.1.0'
          if ($capability.State -ne 'Installed') {Add-WindowsCapability -Online -Name $capability.Name}
          ./scripts/windows_ime_profile.ps1 -Action Prepare
      - name: Non-elevated Windows GUI with native Japanese IME
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/${{ matrix.target }}/release/rescue-gui.exe --output gui-ime-results.json --desktop-token --ime --ime-cycles 8
      - name: Unelevated Windows parent and read-only helper with restored UAC test policy
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_read_access_native.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --limited --output read-access-limited-results.json
      - name: Native capacity failure, permission denial and acquisition resume
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_imaging_native.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output imaging-native-results.json
      - name: Deterministic mutation fuzzing of every CLI-reachable parser
        timeout-minutes: 20
        run: python scripts/ci_command.py python scripts/e2e_fuzz.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --cases 400 --output fuzz-results.json
      - name: Release all-format byte verification
        run: python scripts/ci_command.py python scripts/e2e_formats.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output format-results/release
      - name: Independent deletion and all formats on Linux
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_formats.py --binary target/${{ matrix.target }}/release/rescue --output format-results/independent --independent
      - name: Native read-only virtual disks and partition recovery
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_disks.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output disk-results --native
      - name: Delete PDF and restore to original location on owned virtual volume
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_restore_native.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output restore-native-results.json
      - name: Record original paths and collision evidence
        run: python scripts/ci_command.py python scripts/e2e_restore.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output restore-results.json
      - name: Collect target-specific third-party licenses
        run: python scripts/ci_command.py python scripts/notices.py --target ${{ matrix.target }} --output dist/THIRD_PARTY_NOTICES.txt
      - name: Build installer and portable
        run: python scripts/ci_command.py python scripts/package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --binaries target/${{ matrix.target }}/release
      - name: Verify Linux packages and GUI startup
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py xvfb-run -a python scripts/verify_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --smoke-gui
      - name: Verify native packages and GUI startup
        if: runner.os != 'Linux'
        run: python scripts/ci_command.py python scripts/verify_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --smoke-gui
      - name: Collect native format evidence
        run: python -c "from pathlib import Path;import shutil;shutil.copyfile('format-results/release/results.json','dist/format-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect independent deletion evidence
        if: runner.os == 'Linux'
        run: python -c "import shutil;shutil.copyfile('format-results/independent/results.json','dist/format-results-linux-independent.json')"
      - name: Collect disk access evidence
        run: python -c "import shutil;shutil.copyfile('disk-results/results.json','dist/disk-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect original-location evidence
        run: python -c "import shutil;shutil.copyfile('restore-native-results.json','dist/restore-native-${{ matrix.platform }}-${{ matrix.arch }}.json');shutil.copyfile('restore-results.json','dist/restore-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect JPEG carving evidence
        run: python -c "import shutil;shutil.copyfile('jpeg-results.json','dist/jpeg-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect document and media carving evidence
        run: python -c "import shutil;shutil.copyfile('document-results.json','dist/document-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect NTFS extension evidence
        run: python -c "import shutil;shutil.copyfile('ntfs-results.json','dist/ntfs-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect volume and remnant evidence
        run: python -c "import shutil;shutil.copyfile('discovery-results.json','dist/discovery-results-${{ matrix.platform }}-${{ matrix.arch }}.json');shutil.copyfile('remnant-results.json','dist/remnant-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect indexed scan and selected recovery evidence
        run: python -c "from pathlib import Path;import shutil;[(shutil.copyfile(p,'dist/'+p.stem.replace('e2e_', '').replace('_','-')+'-results-${{ matrix.platform }}-${{ matrix.arch }}.json')) for p in Path('index-results').glob('*.json')]"
      - name: Collect RAID evidence
        run: python -c "import shutil;shutil.copyfile('raid-results.json','dist/raid-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect kernel mdadm evidence
        if: runner.os == 'Linux'
        run: python -c "import shutil;shutil.copyfile('raid-native-results.json','dist/raid-native-linux-x64.json')"
      - name: Collect independent FAT12 and FAT16 evidence
        if: runner.os == 'Linux'
        run: python -c "import shutil;shutil.copyfile('independent-classic-fat.json','dist/independent-classic-fat-linux-x64.json')"
      - name: Collect independent quick-format evidence
        if: runner.os == 'Linux'
        run: python -c "import shutil;shutil.copyfile('quickformat-results.json','dist/quickformat-results-linux-x64.json')"
      - name: Collect Windows native NTFS evidence
        if: runner.os == 'Windows'
        run: python -c "import shutil;shutil.copyfile('ntfs-native-results.json','dist/ntfs-native-windows-x64.json')"
      - name: Collect Windows read-access evidence
        if: runner.os == 'Windows'
        run: python -c "import shutil;shutil.copyfile('read-access-native-results.json','dist/read-access-native-windows-x64.json');shutil.copyfile('read-access-limited-results.json','dist/read-access-limited-windows-x64.json');shutil.copyfile('gui-native-results.json','dist/gui-native-windows-x64.json');shutil.copyfile('gui-limited-results.json','dist/gui-limited-windows-x64.json');shutil.copyfile('gui-keyboard-results.json','dist/gui-keyboard-windows-x64.json');shutil.copyfile('gui-ime-results.json','dist/gui-ime-windows-x64.json')"
      - name: Collect fuzzing evidence
        run: python -c "import shutil;shutil.copyfile('fuzz-results.json','dist/fuzz-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect acquisition evidence
        run: python -c "import shutil;shutil.copyfile('imaging-results.json','dist/imaging-results-${{ matrix.platform }}-${{ matrix.arch }}.json');shutil.copyfile('imaging-native-results.json','dist/imaging-native-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Restore the original Japanese IME test profile
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows_ime_profile.ps1 -Action Restore
      - name: Collect restored Windows input profile evidence
        if: runner.os == 'Windows'
        run: python -c "import shutil;shutil.copyfile('ime-profile-state.json','dist/ime-profile-windows-x64.json')"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*-portable.zip
            dist/*-portable.tar.gz
            dist/*-setup.exe
            dist/*.deb
            dist/*.pkg
            dist/package-*.json
            dist/verification-*.json
            dist/format-results-*.json
            dist/disk-results-*.json
            dist/restore-*.json
            dist/jpeg-results-*.json
            dist/document-results-*.json
            dist/imaging-*.json
            dist/ntfs-*.json
            dist/discovery-*.json
            dist/remnant-*.json
            dist/quickformat-*.json
            dist/raid-*.json
            dist/index-*.json
            dist/preview-*.json
            dist/allocation-scope-*.json
            dist/job-contract-*.json
            dist/naming-*.json
            dist/source-contract-*.json
            dist/read-access-*.json
            dist/gui-*.json
            dist/ime-profile-*.json
            dist/fuzz-*.json
            dist/export-raw-*.json
            dist/damaged-fat-*.json
            dist/classic-fat-*.json
            dist/estimated-fat-*.json
            dist/reports-results-*.json
            dist/release-fixes-results-*.json
            dist/acquisition-results-*.json
            dist/cp932-results-*.json
            dist/exfat-damage-results-*.json
            dist/known-hashes-results-*.json
            dist/independent-classic-fat-*.json
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
      - name: Preserve actual Windows GUI screenshots
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-screenshots
          path: |
            ime-profile-state.json
            gui-*-results.json
            rescue-owned-uia-*/windows*.png
          if-no-files-found: error
      - name: Preserve compiled dependencies after test failures
        if: always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work' || startsWith(github.ref, 'refs/heads/v1-')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package.py --validate-tag "$RELEASE_TAG"
      - name: Validate and assemble every native distribution
        run: |
          python scripts/ci_command.py python scripts/assemble_release.py
          cd release-dist
          sha256sum --check SHA256SUMS.txt
      - name: Upload fully assembled preview
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: verified-all-platforms
          path: release-dist/*
          if-no-files-found: error
      - name: Publish verified installer and portable distributions
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_notes="docs/RELEASE-${RELEASE_TAG}.md"
          if [[ ! -f "$release_notes" ]]; then release_notes="docs/RELEASE-v1.2.md"; fi
          gh release create "$RELEASE_TAG" release-dist/* --verify-tag --prerelease --latest=false --title "Rescue $RELEASE_TAG" --notes-file "$release_notes"
      - name: Verify exact public packages after publishing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh workflow run published-packages.yml --ref "$RELEASE_TAG" -f release_tag="$RELEASE_TAG" -f native_run_id="${{ github.run_id }}"
