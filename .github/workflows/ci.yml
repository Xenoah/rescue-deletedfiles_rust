name: Verify and release
on:
  push:
    branches: [main, work, 'v1-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  MACOSX_DEPLOYMENT_TARGET: '13.0'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            executable: rescue
          - os: windows-2022
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            executable: rescue.exe
          - os: macos-26-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            executable: rescue
          - os: macos-26
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            executable: rescue
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.platform == 'windows' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent preview test decoder
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-test.txt
      - name: Install Linux GUI and independent filesystem tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libxcb-shape0 libxcb-xfixes0 libgl1-mesa-dri libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev xvfb fonts-noto-cjk ntfs-3g dosfstools mtools exfatprogs exfat-fuse mdadm
      - name: Verify disposable native fixture setup before compiling
        timeout-minutes: 4
        run: python scripts/ci_command.py python scripts/e2e_restore_native.py --fixture-only --output fixture-setup.json
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.arch }}-rust-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.arch }}-rust-1.99.1-
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: python scripts/ci_command.py cargo clippy --workspace --all-targets --target ${{ matrix.target }} --locked --offline -- -D warnings
      - run: python scripts/ci_command.py cargo test --workspace --target ${{ matrix.target }} --locked --offline
      - run: python scripts/ci_command.py cargo build --workspace --target ${{ matrix.target }} --locked --offline
      - name: Debug CLI and MCP integration (all twenty-one suites)
        run: python scripts/ci_command.py python scripts/run_integration.py --binary target/${{ matrix.target }}/debug/${{ matrix.executable }}
      - name: Independent NTFS metadata
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/independent_ntfs.py --binary target/${{ matrix.target }}/debug/rescue
      - name: Independent FAT metadata
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/independent_fat.py --binary target/${{ matrix.target }}/debug/rescue
      - name: Build native release executables
        run: python scripts/ci_command.py cargo build --release --workspace --target ${{ matrix.target }} --locked --offline
      - name: Release CLI and MCP integration (all twenty-one suites)
        run: python scripts/ci_command.py python scripts/run_integration.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --index-reports index-results
      - name: Record JPEG entropy and pixel verification
        run: python scripts/ci_command.py python scripts/e2e_jpeg.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output jpeg-results.json
      - name: Record document and media carving verification
        run: python scripts/ci_command.py python scripts/e2e_documents.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output document-results.json
      - name: Record NTFS extension, allocation and alias verification
        run: python scripts/ci_command.py python scripts/e2e_ntfs_extents.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output ntfs-results.json
      - name: Record lost-volume and damaged-boot verification
        run: python scripts/ci_command.py python scripts/e2e_discovery.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output discovery-results.json
      - name: Record detached NTFS and synthetic quick-format verification
        run: python scripts/ci_command.py python scripts/e2e_ntfs_remnants.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output remnant-results.json
      - name: Record RAID missing-member, parity and reconstruction evidence
        run: python scripts/ci_command.py python scripts/e2e_raid.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output raid-results.json
      - name: Independent kernel mdadm RAID5 and RAID6 arrays
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: python scripts/ci_command.py python scripts/e2e_raid_native.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output raid-native-results.json
      - name: Independent actual NTFS quick-format
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_quickformat.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output quickformat-results.json
      - name: Actual Windows NTFS ADS deletion on an owned VHD
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_ntfs_native.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output ntfs-native-results.json
      - name: Record resumable acquisition and read-map verification
        run: python scripts/ci_command.py python scripts/e2e_imaging.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output imaging-results.json
      - name: Windows read-only helper and preview handle transfer on owned VHD
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_read_access_native.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output read-access-native-results.json
      - name: Native Windows UIA from settings to selected ZIP recovery
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/${{ matrix.target }}/release/rescue-gui.exe --output gui-native-results.json
      - name: Unelevated Windows parent and read-only helper with restored UAC test policy
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_read_access_native.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --limited --output read-access-limited-results.json
      - name: Native capacity failure, permission denial and acquisition resume
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_imaging_native.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output imaging-native-results.json
      - name: Deterministic mutation fuzzing of every CLI-reachable parser
        timeout-minutes: 20
        run: python scripts/ci_command.py python scripts/e2e_fuzz.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --cases 400 --output fuzz-results.json
      - name: Release all-format byte verification
        run: python scripts/ci_command.py python scripts/e2e_formats.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output format-results/release
      - name: Independent deletion and all formats on Linux
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_formats.py --binary target/${{ matrix.target }}/release/rescue --output format-results/independent --independent
      - name: Native read-only virtual disks and partition recovery
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_disks.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output disk-results --native
      - name: Delete PDF and restore to original location on owned virtual volume
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_restore_native.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output restore-native-results.json
      - name: Record original paths and collision evidence
        run: python scripts/ci_command.py python scripts/e2e_restore.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output restore-results.json
      - name: Collect target-specific third-party licenses
        run: python scripts/ci_command.py python scripts/notices.py --target ${{ matrix.target }} --output dist/THIRD_PARTY_NOTICES.txt
      - name: Build installer and portable
        run: python scripts/ci_command.py python scripts/package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --binaries target/${{ matrix.target }}/release
      - name: Verify Linux packages and GUI startup
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py xvfb-run -a python scripts/verify_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --smoke-gui
      - name: Verify native packages and GUI startup
        if: runner.os != 'Linux'
        run: python scripts/ci_command.py python scripts/verify_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --smoke-gui
      - name: Collect native format evidence
        run: python -c "from pathlib import Path;import shutil;shutil.copyfile('format-results/release/results.json','dist/format-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect independent deletion evidence
        if: runner.os == 'Linux'
        run: python -c "import shutil;shutil.copyfile('format-results/independent/results.json','dist/format-results-linux-independent.json')"
      - name: Collect disk access evidence
        run: python -c "import shutil;shutil.copyfile('disk-results/results.json','dist/disk-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect original-location evidence
        run: python -c "import shutil;shutil.copyfile('restore-native-results.json','dist/restore-native-${{ matrix.platform }}-${{ matrix.arch }}.json');shutil.copyfile('restore-results.json','dist/restore-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect JPEG carving evidence
        run: python -c "import shutil;shutil.copyfile('jpeg-results.json','dist/jpeg-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect document and media carving evidence
        run: python -c "import shutil;shutil.copyfile('document-results.json','dist/document-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect NTFS extension evidence
        run: python -c "import shutil;shutil.copyfile('ntfs-results.json','dist/ntfs-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect volume and remnant evidence
        run: python -c "import shutil;shutil.copyfile('discovery-results.json','dist/discovery-results-${{ matrix.platform }}-${{ matrix.arch }}.json');shutil.copyfile('remnant-results.json','dist/remnant-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect indexed scan and selected recovery evidence
        run: python -c "from pathlib import Path;import shutil;[(shutil.copyfile(p,'dist/'+p.stem.replace('e2e_', '').replace('_','-')+'-results-${{ matrix.platform }}-${{ matrix.arch }}.json')) for p in Path('index-results').glob('*.json')]"
      - name: Collect RAID evidence
        run: python -c "import shutil;shutil.copyfile('raid-results.json','dist/raid-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect kernel mdadm evidence
        if: runner.os == 'Linux'
        run: python -c "import shutil;shutil.copyfile('raid-native-results.json','dist/raid-native-linux-x64.json')"
      - name: Collect independent quick-format evidence
        if: runner.os == 'Linux'
        run: python -c "import shutil;shutil.copyfile('quickformat-results.json','dist/quickformat-results-linux-x64.json')"
      - name: Collect Windows native NTFS evidence
        if: runner.os == 'Windows'
        run: python -c "import shutil;shutil.copyfile('ntfs-native-results.json','dist/ntfs-native-windows-x64.json')"
      - name: Collect Windows read-access evidence
        if: runner.os == 'Windows'
        run: python -c "import shutil;shutil.copyfile('read-access-native-results.json','dist/read-access-native-windows-x64.json');shutil.copyfile('read-access-limited-results.json','dist/read-access-limited-windows-x64.json');shutil.copyfile('gui-native-results.json','dist/gui-native-windows-x64.json')"
      - name: Collect fuzzing evidence
        run: python -c "import shutil;shutil.copyfile('fuzz-results.json','dist/fuzz-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect acquisition evidence
        run: python -c "import shutil;shutil.copyfile('imaging-results.json','dist/imaging-results-${{ matrix.platform }}-${{ matrix.arch }}.json');shutil.copyfile('imaging-native-results.json','dist/imaging-native-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*-portable.zip
            dist/*-portable.tar.gz
            dist/*-setup.exe
            dist/*.deb
            dist/*.pkg
            dist/package-*.json
            dist/verification-*.json
            dist/format-results-*.json
            dist/disk-results-*.json
            dist/restore-*.json
            dist/jpeg-results-*.json
            dist/document-results-*.json
            dist/imaging-*.json
            dist/ntfs-*.json
            dist/discovery-*.json
            dist/remnant-*.json
            dist/quickformat-*.json
            dist/raid-*.json
            dist/index-*.json
            dist/preview-*.json
            dist/allocation-scope-*.json
            dist/job-contract-*.json
            dist/naming-*.json
            dist/source-contract-*.json
            dist/read-access-*.json
            dist/gui-native-*.json
            dist/fuzz-*.json
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
      - name: Preserve compiled dependencies after test failures
        if: always() && steps.cargo-cache.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package.py --validate-tag "$RELEASE_TAG"
      - name: Validate and assemble every native distribution
        run: |
          python scripts/ci_command.py python scripts/assemble_release.py
          cd dist
          sha256sum --check SHA256SUMS.txt
      - name: Upload fully assembled preview
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: verified-all-platforms
          path: dist/*
          if-no-files-found: error
      - name: Publish verified installer and portable distributions
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --latest=false --title "Rescue $RELEASE_TAG" --notes-file docs/RELEASE-v0.2.md
      - name: Verify exact public packages after publishing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh workflow run published-packages.yml --ref main -f release_tag="$RELEASE_TAG"
