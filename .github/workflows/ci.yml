name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  MACOSX_DEPLOYMENT_TARGET: '13.0'
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
            executable: rescue
          - os: windows-2022
            platform: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            executable: rescue.exe
          - os: macos-15-intel
            platform: macos
            arch: x64
            target: x86_64-apple-darwin
            executable: rescue
          - os: macos-15
            platform: macos
            arch: arm64
            target: aarch64-apple-darwin
            executable: rescue
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.platform == 'windows' && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI and independent filesystem tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libxcb-shape0 libxcb-xfixes0 libgl1-mesa-dri libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev xvfb fonts-noto-cjk ntfs-3g dosfstools mtools exfatprogs
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.arch }}-rust-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.arch }}-rust-1.99.1-
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: python scripts/ci_command.py cargo clippy --workspace --all-targets --target ${{ matrix.target }} --locked --offline -- -D warnings
      - run: python scripts/ci_command.py cargo test --workspace --target ${{ matrix.target }} --locked --offline
      - run: python scripts/ci_command.py cargo build --workspace --target ${{ matrix.target }} --locked --offline
      - name: Debug CLI and MCP integration (all six suites)
        run: python scripts/ci_command.py python scripts/run_integration.py --binary target/${{ matrix.target }}/debug/${{ matrix.executable }}
      - name: Independent NTFS metadata
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/independent_ntfs.py --binary target/${{ matrix.target }}/debug/rescue
      - name: Independent FAT metadata
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/independent_fat.py --binary target/${{ matrix.target }}/debug/rescue
      - name: Build native release executables
        run: python scripts/ci_command.py cargo build --release --workspace --target ${{ matrix.target }} --locked --offline
      - name: Release CLI and MCP integration (all six suites)
        run: python scripts/ci_command.py python scripts/run_integration.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Release all-format byte verification
        run: python scripts/ci_command.py python scripts/e2e_formats.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output format-results/release
      - name: Independent deletion and all formats on Linux
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/e2e_formats.py --binary target/${{ matrix.target }}/release/rescue --output format-results/independent --independent
      - name: Native read-only virtual disks and partition recovery
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_disks.py --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --output disk-results --native
      - name: Collect target-specific third-party licenses
        run: python scripts/ci_command.py python scripts/notices.py --target ${{ matrix.target }} --output dist/THIRD_PARTY_NOTICES.txt
      - name: Build installer and portable
        run: python scripts/ci_command.py python scripts/package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --binaries target/${{ matrix.target }}/release
      - name: Verify Linux packages and GUI startup
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py xvfb-run -a python scripts/verify_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --smoke-gui
      - name: Verify native packages and GUI startup
        if: runner.os != 'Linux'
        run: python scripts/ci_command.py python scripts/verify_package.py --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --smoke-gui
      - name: Collect native format evidence
        run: python -c "from pathlib import Path;import shutil;shutil.copyfile('format-results/release/results.json','dist/format-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Collect independent deletion evidence
        if: runner.os == 'Linux'
        run: python -c "import shutil;shutil.copyfile('format-results/independent/results.json','dist/format-results-linux-independent.json')"
      - name: Collect disk access evidence
        run: python -c "import shutil;shutil.copyfile('disk-results/results.json','dist/disk-results-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*-portable.zip
            dist/*-portable.tar.gz
            dist/*-setup.exe
            dist/*.deb
            dist/*.pkg
            dist/package-*.json
            dist/verification-*.json
            dist/format-results-*.json
            dist/disk-results-*.json
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package.py --validate-tag "$RELEASE_TAG"
      - name: Validate and assemble every native distribution
        run: |
          python scripts/assemble_release.py
          cd dist
          sha256sum --check SHA256SUMS.txt
      - name: Upload fully assembled preview
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: verified-all-platforms
          path: dist/*
          if-no-files-found: error
      - name: Publish verified installer and portable distributions
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --latest=false --title "Rescue $RELEASE_TAG" --notes-file docs/RELEASE-v0.2.md
      - name: Verify exact public packages after publishing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh workflow run published-packages.yml --ref main -f release_tag="$RELEASE_TAG"
