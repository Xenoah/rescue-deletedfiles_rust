name: Capture Apple JPEG 2000 references
on:
  push:
    branches: ['qa/apple-jpeg2000-reference']
permissions:
  contents: read
jobs:
  imageio:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - run: python scripts/qa_apple_jp2.py
      - uses: actions/upload-artifact@v4
        with:
          name: apple-imageio-jp2
          path: apple-reference/
