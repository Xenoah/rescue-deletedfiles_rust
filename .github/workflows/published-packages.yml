name: Verify actual published packages
on:
  push:
    tags: ['qa-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to verify after packaging and signing
        default: v0.2.0-alpha.14
        required: true
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  RELEASE_TAG: ${{ inputs.release_tag || 'v0.2.0-alpha.14' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: windows-2022
            platform: windows
            arch: x64
          - os: macos-26-intel
            platform: macos
            arch: x64
          - os: macos-26
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Select an immutable QA tag's published release
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          match=re.fullmatch(r'qa-(v\d+\.\d+\.\d+(?:-alpha\.\d+)?)-\d+',os.environ['GITHUB_REF_NAME'])
          if not match:raise SystemExit('Expected qa-vVERSION-ATTEMPT tag')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('RELEASE_TAG='+match.group(1)+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match test driver and corpus to release
        shell: bash
        run: git diff --exit-code "$RELEASE_TAG" -- scripts/e2e_formats.py scripts/e2e_disks.py scripts/e2e_features.py scripts/e2e_restore.py scripts/e2e_restore_native.py scripts/e2e.py scripts/e2e_jpeg.py scripts/e2e_documents.py scripts/e2e_imaging.py scripts/e2e_imaging_native.py scripts/e2e_ntfs_extents.py scripts/e2e_ntfs_native.py scripts/e2e_discovery.py scripts/e2e_ntfs_remnants.py scripts/e2e_quickformat.py scripts/e2e_raid.py scripts/e2e_raid_native.py scripts/independent_ntfs.py scripts/make_carve_fixture.py tests/corpus tests/jpeg
      - name: Independent filesystem tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ntfs-3g dosfstools mtools exfatprogs exfat-fuse mdadm
      - name: Test public CLI after packaging and signing
        if: runner.os != 'Linux'
        shell: bash
        run: python scripts/ci_command.py python scripts/test_published_packages.py --tag "$RELEASE_TAG" --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --output public-results
      - name: Test public Linux CLI and independent deletion
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/test_published_packages.py --tag "$RELEASE_TAG" --platform linux --arch x64 --output public-results --independent
      - name: Collect executed result
        run: python -c "import shutil;shutil.copyfile('public-results/results.json','published-format-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - uses: actions/upload-artifact@v4
        with:
          name: published-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: published-format-*.json
          if-no-files-found: error
  attach-evidence:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Select an immutable QA tag's published release
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          match=re.fullmatch(r'qa-(v\d+\.\d+\.\d+(?:-alpha\.\d+)?)-\d+',os.environ['GITHUB_REF_NAME'])
          if not match:raise SystemExit('Expected qa-vVERSION-ATTEMPT tag')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('RELEASE_TAG='+match.group(1)+'\n')
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: published-native-*
          merge-multiple: true
          path: evidence
      - name: Build report and append release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body > current-release.md
          python scripts/published_package_report.py --tag "$RELEASE_TAG" --input-dir evidence --output report --body current-release.md --updated-body updated-release.md
          gh release upload "$RELEASE_TAG" report/* --clobber
          gh release edit "$RELEASE_TAG" --notes-file updated-release.md
          cat report/published-format-verification.md >> "$GITHUB_STEP_SUMMARY"
