name: Verify actual published packages
on:
  push:
    tags: ['qa-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to verify after packaging and signing
        default: v1.0.0
        required: true
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.0' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: windows-2022
            platform: windows
            arch: x64
          - os: macos-26-intel
            platform: macos
            arch: x64
          - os: macos-26
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Select an immutable QA tag's published release
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          match=re.fullmatch(r'qa-(v\d+\.\d+\.\d+(?:-alpha\.\d+)?)-\d+',os.environ['GITHUB_REF_NAME'])
          if not match:raise SystemExit('Expected qa-vVERSION-ATTEMPT tag')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('RELEASE_TAG='+match.group(1)+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent preview and contract validators
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-test.txt
      - name: Match test suites, schemas and corpus to release
        shell: bash
        # Reporting/orchestration fixes may verify an existing immutable release;
        # every actual test suite, fixture and schema must still match its tag.
        run: git diff --exit-code "$RELEASE_TAG" -- scripts schemas tests ':(exclude)scripts/test_published_packages.py' ':(exclude)scripts/published_package_report.py'
      - name: Independent filesystem tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ntfs-3g dosfstools mtools exfatprogs exfat-fuse mdadm
      - name: Install Japanese input support for public GUI verification
        if: runner.os == 'Windows'
        shell: powershell
        timeout-minutes: 10
        run: |
          $capability=Get-WindowsCapability -Online -Name 'Language.Basic~~~ja-JP~0.0.1.0'
          if ($capability.State -ne 'Installed') {Add-WindowsCapability -Online -Name $capability.Name}
      - name: Test public CLI and Windows GUI after packaging and signing
        if: runner.os != 'Linux'
        shell: bash
        run: python scripts/ci_command.py python scripts/test_published_packages.py --tag "$RELEASE_TAG" --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --output public-results
      - name: Test public Linux CLI and independent deletion
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/test_published_packages.py --tag "$RELEASE_TAG" --platform linux --arch x64 --output public-results --independent
      - name: Collect executed result
        run: python -c "import shutil;shutil.copyfile('public-results/results.json','published-format-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - uses: actions/upload-artifact@v4
        with:
          name: published-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: published-format-*.json
          if-no-files-found: error
  attach-evidence:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Select an immutable QA tag's published release
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          match=re.fullmatch(r'qa-(v\d+\.\d+\.\d+(?:-alpha\.\d+)?)-\d+',os.environ['GITHUB_REF_NAME'])
          if not match:raise SystemExit('Expected qa-vVERSION-ATTEMPT tag')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('RELEASE_TAG='+match.group(1)+'\n')
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: published-native-*
          merge-multiple: true
          path: evidence
      - name: Build report and append release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body > current-release.md
          python scripts/published_package_report.py --tag "$RELEASE_TAG" --input-dir evidence --output report --body current-release.md --updated-body updated-release.md
          gh release upload "$RELEASE_TAG" report/* --clobber
          if [ "$RELEASE_TAG" = "v0.2.0-alpha.13" ] && gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq remnant_verification; then
            gh release delete-asset "$RELEASE_TAG" remnant_verification --yes
          fi
          gh release edit "$RELEASE_TAG" --notes-file updated-release.md
          cat report/published-format-verification.md >> "$GITHUB_STEP_SUMMARY"
