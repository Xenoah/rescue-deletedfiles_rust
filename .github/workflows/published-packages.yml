name: Verify actual published packages
on:
  push:
    tags: ['qa-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release to verify after packaging and signing
        default: v1.2.2
        required: true
      native_run_id:
        description: Native release workflow run that produced the packages
        required: true
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
  RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.0' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: windows-2022
            platform: windows
            arch: x64
          - os: macos-26-intel
            platform: macos
            arch: x64
          - os: macos-26
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Select an immutable QA tag's published release
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          match=re.fullmatch(r'qa-(v\d+\.\d+\.\d+(?:-alpha\.\d+)?)-\d+',os.environ['GITHUB_REF_NAME'])
          if not match:raise SystemExit('Expected qa-vVERSION-ATTEMPT tag')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('RELEASE_TAG='+match.group(1)+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent preview and contract validators
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-test.txt
      - name: Match test suites, schemas and corpus to release
        shell: bash
        # Reporting/orchestration fixes may verify an existing immutable release;
        # every actual test suite, fixture and schema must still match its tag.
        run: git diff --exit-code "$RELEASE_TAG" -- scripts schemas tests ':(exclude)scripts/test_published_packages.py' ':(exclude)scripts/published_package_report.py'
      - name: Independent filesystem tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ntfs-3g dosfstools mtools exfatprogs exfat-fuse mdadm
      - name: Install Japanese input support for public GUI verification
        if: runner.os == 'Windows'
        shell: powershell
        timeout-minutes: 10
        run: |
          $capability=Get-WindowsCapability -Online -Name 'Language.Basic~~~ja-JP~0.0.1.0'
          if ($capability.State -ne 'Installed') {Add-WindowsCapability -Online -Name $capability.Name}
          ./scripts/windows_ime_profile.ps1 -Action Prepare
      - name: Fetch native package proof for this immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        shell: bash
        run: |
          python scripts/fetch_package_proof.py --tag "$RELEASE_TAG" --run "$NATIVE_RUN_ID" --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --output native-proof
      - name: Test public CLI after packaging and signing
        if: runner.os != 'Linux'
        shell: bash
        run: python scripts/ci_command.py python scripts/test_published_packages.py --tag "$RELEASE_TAG" --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --output public-results --native-proof-dir native-proof --defer-windows-gui
      - name: Test public Linux CLI and independent deletion
        if: runner.os == 'Linux'
        run: python scripts/ci_command.py python scripts/test_published_packages.py --tag "$RELEASE_TAG" --platform linux --arch x64 --output public-results --native-proof-dir native-proof --independent
      # Each native GUI driver gets its own runner shell, as in tag CI. A
      # sequential in-process loop can lose foreground ownership to the hosted
      # compute agent after the preceding driver exits. The test itself stays
      # byte-identical to the immutable release tag, including its focus checks.
      - name: Public Windows GUI UIA recovery
        if: runner.os == 'Windows' && startsWith(env.RELEASE_TAG, 'v1.')
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary public-results/rescue-gui.exe --output public-results/gui-limited.json --desktop-token
      - name: Public Windows GUI keyboard recovery
        if: runner.os == 'Windows' && startsWith(env.RELEASE_TAG, 'v1.')
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary public-results/rescue-gui.exe --output public-results/gui-keyboard.json --desktop-token --keyboard
      - name: Public Windows GUI native Japanese IME
        if: runner.os == 'Windows' && startsWith(env.RELEASE_TAG, 'v1.')
        timeout-minutes: 5
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary public-results/rescue-gui.exe --output public-results/gui-ime.json --desktop-token --ime --ime-cycles 8
      - name: Collect every public Windows GUI proof
        if: runner.os == 'Windows' && startsWith(env.RELEASE_TAG, 'v1.')
        shell: bash
        run: |
          python - <<'PYTHON'
          import hashlib,json
          from pathlib import Path
          root=Path('public-results'); path=root/'results.json'; result=json.loads(path.read_text(encoding='utf-8'))
          import os
          assert result['published_release']['tag']==os.environ['RELEASE_TAG']
          assert hashlib.sha256((root/'rescue-gui.exe').read_bytes()).hexdigest()==result['public_gui_sha256']
          for kind in ['limited','keyboard','ime']:
              proof=json.loads((root/f'gui-{kind}.json').read_text(encoding='utf-8'))
              assert proof['status']=='passed' and proof['gui_binary_sha256']==result['public_gui_sha256']
              result['gui_verification'][kind]=proof
          path.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PYTHON
      - name: Collect executed result
        run: python -c "import shutil;shutil.copyfile('public-results/results.json','published-format-${{ matrix.platform }}-${{ matrix.arch }}.json')"
      - name: Restore the original Japanese IME test profile
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: ./scripts/windows_ime_profile.ps1 -Action Restore
      - name: Require normal GUI exit and restored Windows input settings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PYTHON'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from ime_evidence import require_ime_cleanup
          profile=json.loads(Path('ime-profile-state.json').read_text(encoding='utf-8-sig'))
          path=Path('published-format-windows-x64.json'); result=json.loads(path.read_text())
          require_ime_cleanup(result['gui_verification']['ime'],profile)
          result['ime_profile_cleanup']=profile
          path.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: published-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: published-format-*.json
          if-no-files-found: error
      - name: Preserve actual public Windows GUI screenshots
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: public-windows-gui-screenshots
          path: |
            ime-profile-state.json
            public-results/gui-*.json
            public-results/rescue-owned-uia-*/windows*.png
          if-no-files-found: error
  attach-evidence:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Select an immutable QA tag's published release
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          match=re.fullmatch(r'qa-(v\d+\.\d+\.\d+(?:-alpha\.\d+)?)-\d+',os.environ['GITHUB_REF_NAME'])
          if not match:raise SystemExit('Expected qa-vVERSION-ATTEMPT tag')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:f.write('RELEASE_TAG='+match.group(1)+'\n')
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: published-native-*
          merge-multiple: true
          path: evidence
      - name: Build report and append release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" --json body --jq .body > current-release.md
          python scripts/published_package_report.py --tag "$RELEASE_TAG" --input-dir evidence --output report --body current-release.md --updated-body updated-release.md
          gh release edit "$RELEASE_TAG" --notes-file updated-release.md
          cat report/published-format-verification.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: published-verification
          path: report/*
          retention-days: 90
          if-no-files-found: error
