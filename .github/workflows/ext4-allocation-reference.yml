name: Capture ext4 32-byte descriptor groups and checksum seed
on:
  push:
    branches: [qa/ext4-free-space-reference]
    paths: [.github/workflows/ext4-allocation-reference.yml, tests/ext4-allocation/generate_linux.py]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Format owned images, write controls and unlink original files using the Linux kernel
        run: |
          sudo python3 tests/ext4-allocation/generate_linux.py --short-only
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add tests/ext4-allocation/*-short.raw.xz tests/ext4-allocation/short.json
          git commit -m "Preserve ext4 short descriptors and checksum-seed free-space controls"
          git push origin HEAD:qa/ext4-free-space-reference
