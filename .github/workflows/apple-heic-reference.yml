name: Preserve natively encoded Apple ImageIO HEIC files
on:
  push:
    branches: [qa/apple-heic-reference]
    paths: [.github/workflows/apple-heic-reference.yml]
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apple-heic
          run-id: 44652074819
          github-token: ${{ github.token }}
          path: tests/heif/apple
      - name: Independently decode and preserve the existing macOS originals
        run: |
          sudo apt-get update
          sudo apt-get install -y libheif-examples
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess, tempfile
          root=Path('tests/heif/apple')
          manifest=json.loads((root/'manifest.json').read_text())
          assert set(manifest)=={'apple-'+n+'.heic' for n in ('landscape','portrait','alpha','gray','deep')}
          with tempfile.TemporaryDirectory() as tmp:
              for name,meta in manifest.items():
                  data=(root/name).read_bytes()
                  assert len(data)==meta['bytes'] and hashlib.sha256(data).hexdigest()==meta['sha256']
                  path=Path(tmp)/(name+'.jpg')
                  subprocess.run(['heif-convert',root/name,path],check=True)
                  rendered = path.read_bytes()
                  assert rendered.startswith(b'\xff\xd8') and rendered.endswith(b'\xff\xd9')
          PY
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add tests/heif/apple
          git commit -m "Preserve five macOS HEIC originals after independent Linux decoding"
          git push origin HEAD:qa/apple-heic-reference
