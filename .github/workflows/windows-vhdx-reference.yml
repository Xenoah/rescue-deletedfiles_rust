name: Verify guest bytes after seven Windows NTFS deletions in fixed and expandable VHDX
on:
  push:
    branches: ['testing/windows-vhdx-reference']
    paths: ['.github/workflows/windows-vhdx-reference.yml', 'scripts/generate_windows_vhdx_reference.py']
permissions:
  contents: read
jobs:
  reference:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create disposable VHDX files and read both guest disks with the Windows driver
        run: python scripts/ci_command.py python scripts/generate_windows_vhdx_reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-vhdx
          path: windows-vhdx-proof/
          retention-days: 7
  preserve:
    needs: reference
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-vhdx
          path: tests/windows-vhdx
      - name: Independently compare both Windows guest disks with QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-utils
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,lzma,subprocess,tempfile
          for kind in ('fixed','expandable'):
              p=Path('tests/windows-vhdx')/kind
              m=json.loads((p/'manifest.json').read_text())
              packed=(p/'volume.vhdx.xz').read_bytes()
              assert len(packed)<3<<20 and hashlib.sha256(packed).hexdigest()==m['packed_sha256']
              with tempfile.TemporaryDirectory() as tmp:
                  src=Path(tmp)/'disk.vhdx';raw=Path(tmp)/'disk.raw'
                  src.write_bytes(lzma.decompress(packed))
                  assert hashlib.sha256(src.read_bytes()).hexdigest()==m['container_sha256']
                  subprocess.run(['qemu-img','convert','-f','vhdx','-O','raw',src,raw],check=True)
                  assert raw.stat().st_size==m['guest_bytes']==96<<20
                  assert hashlib.sha256(raw.read_bytes()).hexdigest()==m['guest_sha256']
                  with raw.open('rb') as f:
                      assert [hashlib.sha256(f.read(1<<20)).hexdigest() for _ in range(96)]==m['guest_mib_sha256']
                  assert len(m['originals'])==7
          PY
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add tests/windows-vhdx
          git commit -m "Preserve Windows VHDX fixtures after kernel NTFS deletions and independent QEMU conversion"
          git push origin HEAD:testing/windows-vhdx-reference
