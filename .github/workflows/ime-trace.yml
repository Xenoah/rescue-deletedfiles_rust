name: Trace Windows IME cancellation
on:
  push:
    branches: ['fix/windows-ime-trace']
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  RESCUE_IME_TRACE: '1'
  RUSTFLAGS: '-C target-feature=+crt-static'
jobs:
  trace:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-test.txt
      - run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-2022-x64-rust-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-2022-x64-rust-1.99.1-
      - name: Instrument this diagnostic build only
        run: python scripts/instrument_ime_trace.py
      - name: Build the owned minidump reader with the installed Windows SDK
        shell: pwsh
        run: |
          $vs=& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 && cl /nologo /EHsc /MT scripts\inspect_windows_dump.cpp /Fe:inspect-windows-dump.exe /link dbgeng.lib"
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Build traced GUI
        run: python scripts/ci_command.py cargo rustc --release -p rescue-gui --target x86_64-pc-windows-msvc --locked --offline -- -C debuginfo=1 -C strip=none
      - name: Reproduce the preceding native GUI sessions
        shell: bash
        run: |
          python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/x86_64-pc-windows-msvc/release/rescue-gui.exe --output trace-native.json
          python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/x86_64-pc-windows-msvc/release/rescue-gui.exe --output trace-limited.json --desktop-token
          python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/x86_64-pc-windows-msvc/release/rescue-gui.exe --output trace-keyboard.json --desktop-token --keyboard
      - name: Install Japanese input support after the preceding GUI sessions
        shell: powershell
        timeout-minutes: 10
        run: |
          $capability=Get-WindowsCapability -Online -Name 'Language.Basic~~~ja-JP~0.0.1.0'
          if ($capability.State -ne 'Installed') {Add-WindowsCapability -Online -Name $capability.Name}
      - name: Trace eight IME cycles in each of four fresh GUI processes
        shell: bash
        run: |
          for session in 1 2 3 4; do
            python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/x86_64-pc-windows-msvc/release/rescue-gui.exe --output "trace-ime-$session.json" --desktop-token --ime --ime-cycles 8 || exit $?
          done
      - name: Inspect owned GUI dumps after a failure
        if: always()
        shell: pwsh
        timeout-minutes: 5
        run: |
          $symbols="srv*$env:RUNNER_TEMP\rescue-symbols*https://msdl.microsoft.com/download/symbols;$env:GITHUB_WORKSPACE\target\x86_64-pc-windows-msvc\release"
          Get-ChildItem rescue-owned-uia-*/owned-gui-failed.dmp | ForEach-Object {
            & ./inspect-windows-dump.exe $_.FullName $symbols 2>&1 | Out-File (Join-Path $_.DirectoryName 'native-stacks.txt') -Encoding utf8
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ime-event-trace
          path: |
            trace-*.json
            rescue-owned-uia-*/uia.json
            rescue-owned-uia-*/*.txt
            rescue-owned-uia-*/windows*.png
            rescue-owned-uia-*/*.dmp
          if-no-files-found: error
