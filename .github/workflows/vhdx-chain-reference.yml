name: Capture Windows differencing VHDX references
on:
  push:
    branches: [qa/windows-vhdx-chain-reference]
permissions:
  contents: read
jobs:
  capture:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record seven actual NTFS unlinks per chain and replay all seven generations through Windows
        run: python -u tests/vhdx-chain/generate_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-differencing-vhdx
          path: |
            tests/vhdx-chain/**/manifest.json
            tests/vhdx-chain/**/*.xz
