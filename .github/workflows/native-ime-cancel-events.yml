name: Trace native cancellation in eight consecutive IME compositions
on:
  push:
    branches: ['testing/ime-prediction-events']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ime-regression-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  RUSTFLAGS: '-C target-feature=+crt-static'
jobs:
  regression:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r scripts/requirements-test.txt
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-2022-x64-rust-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-2022-x64-rust-1.99.1-
      - run: cargo fetch --locked
      - name: Compile a diagnostic GUI with native input event logging
        run: |
          python scripts/instrument_ime_trace.py
          cargo build --locked --release --target x86_64-pc-windows-msvc -p rescue-gui
      - name: Prepare Japanese input
        shell: powershell
        timeout-minutes: 10
        run: |
          $capability=Get-WindowsCapability -Online -Name 'Language.Basic~~~ja-JP~0.0.1.0'
          if ($capability.State -ne 'Installed') {Add-WindowsCapability -Online -Name $capability.Name}
          ./scripts/windows_ime_profile.ps1 -Action Prepare
      - name: Observe a fresh eight-cycle Japanese keyboard session
        run: python scripts/ci_command.py python scripts/e2e_gui_windows.py --binary target/x86_64-pc-windows-msvc/release/rescue-gui.exe --output ime-event-results.json --desktop-token --ime --ime-cycles 8
      - name: Restore the original user language profile
        if: always()
        shell: powershell
        run: ./scripts/windows_ime_profile.ps1 -Action Restore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ime-input-events
          path: |
            ime-event-results.json
            rescue-owned-uia-*/uia.json
            rescue-owned-uia-*/std*.txt
            rescue-owned-uia-*/windows-ime-cycle-*.png
          if-no-files-found: error
