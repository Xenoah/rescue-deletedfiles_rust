name: Check Apple disk image encoders
on:
  push:
    branches: [testing/apple-udif]
permissions:
  contents: read
jobs:
  apple:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-26-intel-x64-rust-1.99.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-26-intel-x64-rust-1.99.1-
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo build -p rescue-cli --locked --target x86_64-apple-darwin
      - run: mkdir apple-media
      - name: Convert Apple-encoded media and restore deleted originals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,'scripts')
          from e2e_udif import apple_images
          apple_images(Path('target/x86_64-apple-darwin/debug/rescue').resolve(),Path('apple-media').resolve())
          PY
      - name: Create native LZFSE and LZMA images for independent decoder validation
        run: |
          for codec in ULFO ULMO; do
            hdiutil convert tests/udif/apm-fat32.dmg -format "$codec" -o "apple-media/$codec.dmg"
            hdiutil verify "apple-media/$codec.dmg"
            hdiutil convert "apple-media/$codec.dmg" -format UDTO -o "apple-media/$codec.cdr"
            shasum -a 256 "apple-media/$codec.dmg" "apple-media/$codec.cdr"
          done
      - name: Save the independent DiskImages outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-encoder-output
          path: |
            apple-media/ULFO.dmg
            apple-media/ULMO.dmg
          retention-days: 3
