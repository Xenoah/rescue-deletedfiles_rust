name: Retry hosted runner and artifact delivery failures
on:
  push:
    branches: [main]
    paths: [.github/workflows/retry-runner-allocation.yml]
  workflow_run:
    workflows: [Verify and release, Verify actual published packages]
    types: [completed]
permissions:
  actions: write
  contents: read
jobs:
  retry:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.run_attempt < 3)
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    steps:
      - name: Retry runner allocation or artifact-only failures, at most three attempts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
          FAILED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_WORKFLOW: ${{ github.event.workflow_run.name }}
          RETRY_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess
          repo=os.environ['GH_REPO']
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path],text=True,timeout=30))
          if os.environ['RETRY_EVENT']=='push':
              # Updating this policy also reevaluates the latest failed release
              # tag. It does not rebuild successful releases or feature branches.
              runs=api('repos/'+repo+'/actions/workflows/ci.yml/runs?event=push&per_page=30')['workflow_runs']
              releases=[run for run in runs if re.fullmatch(r'v[0-9]+\..+',run.get('head_branch',''))]
              if not releases or releases[0]['conclusion']!='failure':
                  print('No latest failed release tag requires recovery.')
                  raise SystemExit(0)
              chosen=releases[0]
              if chosen['head_repository']['full_name']!=repo:
                  raise SystemExit('Foreign repository is never retried')
              run_id=str(int(chosen['id']))
              branch=chosen['head_branch']
          else:
              run_id=str(int(os.environ['FAILED_RUN_ID']))
              branch=os.environ['FAILED_BRANCH']
          if branch in ('main','work'):
              if branch=='work' and os.environ['FAILED_WORKFLOW']!='Verify actual published packages':
                  print('Only published-package QA is retried on work.')
                  raise SystemExit(0)
              if api('repos/'+repo+'/commits/'+branch)['sha']!=os.environ['FAILED_SHA']:
                  print('Superseded branch commit; no retry.')
                  raise SystemExit(0)
          elif not branch.startswith('v'):
              print('Only current main, published-package QA and release tags are retried.')
              raise SystemExit(0)
          run=api('repos/'+repo+'/actions/runs/'+run_id)
          if int(run.get('run_attempt',3))>=3:
              print('Retry limit reached; no further execution.')
              raise SystemExit(0)
          data=api('repos/'+repo+'/actions/runs/'+run_id+'/jobs?filter=latest&per_page=100')
          failed=[job for job in data['jobs'] if job['conclusion']=='failure']
          def infrastructure_only(job):
              steps=job.get('steps')
              if steps==[]:
                  return True
              if not isinstance(steps,list):
                  return False
              failures=[step for step in steps if step.get('conclusion')=='failure']
              # A package/test/assembly failure is never retried by this rule.
              # Existing tagged workflows use the default upload action name.
              return bool(failures) and all(step.get('name') in (
                  'Run actions/upload-artifact@v4', 'Upload fully assembled preview',
                  'Upload native distributions') for step in failures)
          if data['total_count']>100 or not failed or not all(infrastructure_only(job) for job in failed):
              print('Failure is not exclusively runner allocation or artifact delivery; no automatic retry.')
              raise SystemExit(0)
          print('Retrying failed jobs with allocation/artifact-only failures:',run_id)
          subprocess.run(['gh','run','rerun',run_id,'--failed'],check=True,timeout=30)
          PYCODE
