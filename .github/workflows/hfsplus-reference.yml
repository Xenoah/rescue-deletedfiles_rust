name: Capture journaled Apple HFS Plus and HFSX deletions
on:
  push:
    branches: [qa/hfsplus-deletion-reference]
    paths: [.github/workflows/hfsplus-reference.yml, tests/hfsplus/generate_macos.py]
permissions:
  contents: write
jobs:
  capture:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Format two owned disk images and preserve deleted and live controls
        run: |
          sudo "$(command -v python3)" tests/hfsplus/generate_macos.py --journaled-only
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add tests/hfsplus/*-journaled.raw.xz tests/hfsplus/journaled.json
          git commit -m "Preserve journaled Apple HFS Plus and HFSX volumes after real deletions"
          git push origin HEAD:qa/hfsplus-deletion-reference
